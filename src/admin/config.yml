# =============================================================
#  DECAP CMS CONFIG
#  Only the fields listed here appear in the client's panel.
#  seo.yml and site.yml are intentionally NOT listed, so the
#  client cannot see or change SEO, schema, or the domain.
# =============================================================

# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: SPSFitness/IRetreat-
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/42ff9e7f-b157-4ce0-a551-7e94d09b8fc9/pkce
  auth_token_endpoint: /sites/42ff9e7f-b157-4ce0-a551-7e94d09b8fc9/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: 'Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    update: 'Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    delete: 'Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 'Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    openAuthoring: 'Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge'

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

site_url: "https://iretreat.pt"
display_url: "https://iretreat.pt"

media_folder: "src/images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Website content"
    delete: false
    files:
      - name: "home"
        label: "Homepage"
        file: "src/_data/home.yml"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "heading", widget: "string" }
              - { label: "Highlighted word (from the headline)", name: "heading_accent", widget: "string", hint: "Must exactly match a word in the headline. It gets the accent colour." }
              - { label: "Intro paragraph", name: "intro", widget: "text" }
              - { label: "Hero photo", name: "image", widget: "image" }
              - label: "Stats"
                name: "stats"
                widget: "list"
                max: 3
                fields:
                  - { label: "Number", name: "num", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }

          - label: "Feature strip"
            name: "strip"
            widget: "list"
            max: 6
            field: { label: "Item", name: "item", widget: "string" }

          - label: "Intro section"
            name: "intro_section"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Highlighted word (from the heading)", name: "accent", widget: "string" }
              - { label: "Paragraph", name: "lede", widget: "text" }

          - { label: "Features eyebrow", name: "features_eyebrow", widget: "string" }
          - { label: "Features heading", name: "features_heading", widget: "string" }
          - label: "Features"
            name: "features"
            widget: "list"
            max: 6
            fields:
              - { label: "Number", name: "num", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

          - label: "Business section"
            name: "business"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - label: "Commercial points"
                name: "points"
                widget: "list"
                max: 3
                fields:
                  - { label: "Number / label", name: "num", widget: "string" }
                  - { label: "Text", name: "title", widget: "string" }
              - { label: "Support heading", name: "support_heading", widget: "string" }
              - { label: "Support text", name: "support_text", widget: "text" }

          - label: "Gallery section"
            name: "space"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Brochure button text", name: "brochure_text", widget: "string", required: false }
              - { label: "Brochure link", name: "brochure_url", widget: "string", required: false }
              - label: "Photos (keep to 7, order matters for the layout)"
                name: "gallery"
                widget: "list"
                min: 7
                max: 7
                fields:
                  - { label: "Photo", name: "image", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string" }

          - { label: "How it works eyebrow", name: "how_eyebrow", widget: "string" }
          - { label: "How it works heading", name: "how_heading", widget: "string" }
          - label: "Steps"
            name: "how"
            widget: "list"
            max: 4
            fields:
              - { label: "Number", name: "num", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

          - { label: "Testimonials eyebrow", name: "testimonials_eyebrow", widget: "string" }
          - { label: "Testimonials heading", name: "testimonials_heading", widget: "string" }
          - { label: "Google reviews link", name: "testimonials_google_url", widget: "string", required: false }
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            max: 6
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Country", name: "country", widget: "string" }

          - label: "Availability section"
            name: "availability"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Address", name: "address", widget: "string" }

          - label: "Social links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
              - { label: "YouTube URL", name: "youtube", widget: "string", required: false }
              - { label: "WhatsApp number (digits only, no + or spaces)", name: "whatsapp", widget: "string", required: false }

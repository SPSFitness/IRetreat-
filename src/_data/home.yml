hero:
  eyebrow: "Private retreat venue · Central Portugal"
  heading: "Host your retreat, beautifully handled."
  heading_accent: "beautifully"
  intro: "A private, fully-equipped quinta in the hills of central Portugal, for yoga, wellness and fitness leaders who want to focus on their people, not the logistics."
  image: "/images/hero.jpg"
  stats:
    - num: "15"
      label: "Guests, exclusive use"

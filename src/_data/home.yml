hero:
  eyebrow: Fitness Retreat Venue · Central Portugal
  heading: A fitness retreat worth repeating.
  heading_accent: repeating
  intro: Bring up to 16 people from your community to your own private venue in
    Portugal, with everything in one place to train, recover, eat well and spend
    time together in nature. Flexible booking terms and our family-run team make
    hosting easier.
  image: /images/hero.jpg
  stats:
    - num: "16"
      label: Guests, exclusive use
    - num: "1"
      label: Private property, all yours
    - num: 30 days
      label: Soft hold before payment
strip:
  - Fully-equipped gym
  - Indoor & outdoor training spaces
  - Pool, sauna & jacuzzi
  - Fresh, flexible meals
  - Lisbon airport transfers
intro_section:
  eyebrow: For You and Your Community
  heading: A retreat your community loves. One you profit from.
  accent: profit
  lede: And not just financially. A great retreat brings your community closer, is
    enjoyable to run and leaves enough margin to make it worthwhile. iRetreat is
    set up to help you achieve all three.
features_eyebrow: Built for Fitness Retreats
features_heading: Train hard and still feel like you’re on retreat.
features:
  - num: "01"
    title: Train your way
    text: Run your programme your way, with a fully equipped gym with indoor and
      outdoor spaces for strength, conditioning and mobility.
  - num: "02"
    title: Build in recovery
    text: Cool off in the saltwater pool after training, use the sauna or jacuzzi,
      or recover outside surrounded by trees and open hillsides.
  - num: "03"
    title: Your menu
    text: Fresh, local meals planned around your schedule, your group, and any
      dietary requirements.
  - num: "04"
    title: Just your group
    text: With the whole property to yourselves, up to 16 of you can train, eat, and
      spend time together, building stronger relationships beyond the gym.
  - num: "05"
    title: Beyond fitness
    text: Gather around the fireplace, hang out in the social dome, meet the farm
      animals or spend evenings by the lit-up pool.
  - num: "06"
    title: Away from it all
    text: Surrounded by forest and farmland with no neighbours around, your group
      can leave the noise and everyday routine behind.
space:
  eyebrow: The Retreat Space
  heading: Everything your retreat needs, in one place.
  intro: Train, recover, eat, relax and spend time together without having to move
    your group between different locations. From the gym and outdoor training
    spaces to the pool, shared areas and accommodation, the whole property is
    yours for the retreat.
  gallery:
    - image: /images/pool-night.jpg
      caption: The pool, after dark
    - image: /images/domes.jpg
      caption: Domes in the hills
    - image: /images/food.jpg
      caption: Fresh, local food
    - image: /images/sauna.jpg
      caption: Infrared sauna
    - image: /images/lounge.jpg
      caption: Lounge & dining
    - image: /images/firepit.jpg
      caption: Fire pit evenings
    - image: /images/kitchen.jpg
      caption: The kitchen
how_eyebrow: How it works
how_heading: Four steps from idea to retreat.
how:
  - num: "01"
    title: Choose your dates
    text: Check availability and lock in the week that works for you and your group.
  - num: "02"
    title: Promote your retreat
    text: Fill your places with our imagery, brochures and host resources behind you.
  - num: "03"
    title: Plan with support
    text: Menus, transfers and schedule, planned together and handled for you.
  - num: "04"
    title: Arrive and lead
    text: Turn up to a space that's ready, and do the work only you can do.
testimonials_eyebrow: What hosts say
testimonials_heading: Retreats they're proud to run.
testimonials:
  - quote: The perfect place for a complete get away from it all. Andrew, Rosie and
      Sofia (and Rosie the dog and Nero) made us feel so welcome in their
      beautiful home. We were a group of 11 women on a 5 night stay for a
      yoga/pilates retreat. The facilities were excellent with lots of different
      spaces to use. The peace and tranquillity is something you don’t get
      often. The food was amazing, very healthy and plentiful. Our hosts have
      achieved a lovely balance to make people feel welcome and provide for
      their needs but with space to do your own thing. Absolutely loved it, most
      highly recommended. Thank you iRetreat ♥️
    name: Sue Entwistle
    country: UK
  - quote: >-
      Time Out Pilates and Yoga Retreat ( May 2026). IRetreat is a gem , nestled
      away in beautiful and peaceful countryside. The hosts could not of done
      more to make our stay amazing , we all felt like part of the family. The
      food was healthy and restaurant standard . Andrew organised a day trip to
      a stunning river beach - cold water swimming in such a picturesque setting
      and we all loved chilling with an icecream in Tomar . We are planning to
      return

      Thanks Andrew , Rosie and Sophia for making our stay very special
    name: Jacqui Pickles
    country: UK
  - quote: >-
      I hosted my Bootcamp & Fitness Wellness Retreat at iRetreat in April 2026,
      run by Andrew and Rosie, and it was an excellent experience from start to
      finish. The accommodation was comfortable, and the venue itself is
      impressively spacious with various areas for us to use. Beautifully set in
      a serene and peaceful part of central Portugal, which was ideal for
      switching off and focusing on fitness and wellbeing.


      Andrew and Rosie were incredibly attentive throughout, always on hand to support the needs of the group. The catering was a real highlight: high quality, thoughtfully prepared, and flexible enough to accommodate a range of dietary requirements without any issues.

      What really sets iRetreat apart is its warm, family-run atmosphere. It has a genuinely homely and relaxed feel, which made everyone feel welcome right away. There’s also plenty to explore on the grounds, from animals to an abundance of homegrown fruit and vegetables, adding to the overall charm of the place.

      All in all, our group had a fantastic time. If you’re looking for a peaceful, well-equipped venue with ample space to host any kind of retreat, iRetreat is a strong choice - you won't be disappointed!
    name: Paula Watson Zumba
    country: UK

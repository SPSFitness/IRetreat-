intro_section:
  eyebrow: Why leaders choose iRetreat
  heading: Not just a venue, but a space built for transformation.
  accent: transformation.
  lede: Whether you guide through yoga, coaching, meditation or fitness, the
    property adapts to your flow. We take care of the setting and the support,
    so you stay entirely present with your group and your message.
features_eyebrow: Everything included
features_heading: Turnkey from the moment your guests arrive.
features:
  - num: "01"
    title: Exclusive use
    text: "The entire property is yours for the week: private, uninterrupted, and
      set up for groups of up to 15."
  - num: "02"
    title: Practice spaces
    text: Indoor yoga & meditation shala plus an outdoor deck, ready for whatever
      your programme demands.
  - num: "03"
    title: Pool, sauna & gym
    text: Saltwater pool, sauna, a fully-equipped gym and open gardens for recovery
      and connection.
  - num: "04"
    title: Airport transfers
    text: Transfer support from Lisbon arranged for your group, so arrival is smooth
      from the first moment.
  - num: "05"
    title: Real host profit
    text: Honest, affordable pricing that leaves genuine margin, so leading a
      retreat grows your business.
  - num: "06"
    title: Support, not interference
    text: On-site help whenever you need it, and complete space when you don't. Your
      retreat stays yours.
